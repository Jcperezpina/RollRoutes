<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER USUARIO -->
    <div class="d-flex justify-content-end align-items-center gap-2 mb-3">

        <div th:if="${session.usuarioLogueado != null}">
            <span>
                👤 <b th:text="${session.usuarioLogueado.nombre}"></b>
            </span>
        </div>

        <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'ADMIN'}"
           href="/usuarios-web"
           class="btn btn-outline-dark btn-sm">
            Usuarios
        </a>

        <a href="/logout" class="btn btn-outline-danger btn-sm">
            Cerrar sesión
        </a>

    </div>

    <!-- BLOQUE USUARIOS -->
    <div class="bg-white p-3 rounded shadow-sm mb-4">

        <h1 class="mb-3">Lista de usuarios</h1>

        <table class="table table-striped table-hover align-middle">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>

            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.email}"></td>

                <td>
                    <a class="btn btn-outline-primary btn-sm px-2 py-0 me-1"
                       th:href="@{'/usuarios-web/editar/' + ${usuario.id}}">
                        Editar
                    </a>

                    <a class="btn btn-outline-danger btn-sm px-2 py-0"
                       th:href="@{'/usuarios-web/eliminar/' + ${usuario.id}}">
                        Eliminar
                    </a>
                </td>

            </tr>
        </table>

    </div>

</div>

</body>
</html>
