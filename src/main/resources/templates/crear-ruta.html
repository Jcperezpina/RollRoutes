<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Ruta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER USUARIO -->
    <div class="d-flex justify-content-end align-items-center gap-2 mb-3">

        <div th:if="${session.usuarioLogueado != null}">
            <span>
                👤 <b th:text="${session.usuarioLogueado.nombre}"></b>
            </span>
        </div>

        <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'ADMIN'}"
           href="/usuarios-web"
           class="btn btn-outline-dark btn-sm">
            Usuarios
        </a>

        <a href="/logout" class="btn btn-outline-danger btn-sm">
            Cerrar sesión
        </a>

    </div>

    <!-- FORMULARIO -->
    <div class="bg-white p-4 rounded shadow-sm">

        <h1 class="mb-4">Crear nueva ruta</h1>

        <form action="/rutas/crear" method="post">

            <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input type="text" name="nombre" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <input type="text" name="descripcion" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Ubicación:</label>
                <input type="text" name="ubicacion" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha:</label>
                <input type="date" name="fecha" class="form-control">
            </div>

            <button type="submit" class="btn btn-warning">
                Crear
            </button>

        </form>

    </div>

</div>

</body>
</html>
