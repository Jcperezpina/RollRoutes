<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Header usuario -->
    <div class="d-flex justify-content-end align-items-center gap-2 mb-3">

        <div th:if="${session.usuarioLogueado != null}">
            <span>
                👤 <b th:text="${session.usuarioLogueado.nombre}"></b>
            </span>
        </div>

        <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'ADMIN'}"
           href="/usuarios-web"
           class="btn btn-outline-dark btn-sm">
            Usuarios
        </a>

        <a href="/logout" class="btn btn-outline-danger btn-sm">
            Cerrar sesión
        </a>

    </div>

    <!-- Formulario -->
    <div class="bg-white p-4 rounded shadow-sm">

        <h1 class="mb-4">Crear evento de ruta</h1>

        <form action="/agenda/crear" method="post">

            <div class="mb-3">
                <label class="form-label">Ruta:</label>
                <select name="rutaId" class="form-select">
                    <option th:each="ruta : ${rutas}"
                            th:value="${ruta.id}"
                            th:text="${ruta.nombre}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha:</label>
                <input type="date" name="fecha" class="form-control">
            </div>

            <button type="submit" class="btn btn-warning">
                Crear evento
            </button>

        </form>

    </div>

</div>

</body>
</html>
